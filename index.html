<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta dei Vini</title>
    <link rel="icon" type="image/png" sizes="192x192" href="https://niubbone.github.io/cartaqr/graphic/logo.png">
    <link rel="apple-touch-icon" href="https://niubbone.github.io/cartaqr/graphic/logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5d0f10;
            --secondary-color: #2a619e;
            --text-color: #333;
            --bg-color: #f9f7f4;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Roboto', sans-serif;
            --unavailable-color: #c94040;
            --unavailable-bg: #fff;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: var(--font-serif);
            color: var(--primary-color);
            font-size: 2.8em;
            margin: 0;
            position: relative;
            display: inline-block;
        }

        .header h1::after {
            content: '';
            width: 80px;
            height: 3px;
            background: var(--secondary-color);
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            margin: 0 0 20px;
            background: var(--bg-color);
            border-radius: 8px;
            border: 1px solid #e8e4df;
            overflow: hidden;
        }

        .filter-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .filter-header:hover {
            background: rgba(0,0,0,0.03);
        }

        .filter-header-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--primary-color);
        }

        .bottle-icon {
            display: inline-block;
            transition: transform 0.35s ease;
            line-height: 1;
        }

        .bottle-icon.open {
            transform: rotate(180deg);
        }

        .bottle-icon svg {
            width: 16px;
            height: 16px;
            fill: var(--primary-color);
        }

        .active-count {
            font-family: var(--font-sans);
            font-size: 11px;
            background: var(--primary-color);
            color: #fff;
            border-radius: 10px;
            padding: 2px 8px;
        }

        .filter-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 16px;
        }

        .filter-body.open {
            max-height: 500px;
            padding: 0 16px 16px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }

        .filter-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            user-select: none;
        }

        .filter-toggle input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            min-width: 55px;
            flex-shrink: 0;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            background: #fff;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            white-space: nowrap;
        }

        .chip.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .chip:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Country: chips on desktop, dropdown on mobile */
        .country-chips-desktop {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .country-dropdown-mobile {
            display: none;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .country-select {
            font-family: var(--font-sans);
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            color: var(--text-color);
            appearance: auto;
            cursor: pointer;
            width: 100%;
        }

        .country-select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .country-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .country-tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 14px;
            background: var(--primary-color);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .country-tag-x {
            font-size: 14px;
            font-weight: 500;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .country-chips-desktop {
                display: none;
            }
            .country-dropdown-mobile {
                display: flex;
            }
        }

        .no-results {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 0;
            font-size: 14px;
        }

        /* ===== WINE LIST ===== */
        .wine-section {
            margin-bottom: 30px;
        }

        .wine-section-title {
            font-family: var(--font-serif);
            color: var(--primary-color);
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            display: block;
        }

        .country-title {
            font-family: var(--font-serif);
            font-size: 1.5em;
            color: var(--secondary-color);
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .wine-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 10px;
            border-left: 3px solid var(--secondary-color);
            transition: background-color 0.2s, border-left-color 0.2s;
        }

        .wine-item[data-has-description="true"]:not(.unavailable):hover {
            background-color: #fdfaf7;
            border-left-color: var(--primary-color);
        }

        .wine-details {
            flex-grow: 1;
        }

        .wine-name {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--primary-color);
        }

        .wine-info {
            font-size: 0.9em;
            color: #555;
            margin-top: 5px;
        }

        .wine-price {
            font-family: var(--font-serif);
            font-size: 1.2em;
            font-weight: bold;
            color: var(--secondary-color);
            margin-left: 20px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .unavailability-tag {
            font-size: 0.8em;
            color: var(--unavailable-color);
            border: 1px solid var(--unavailable-color);
            padding: 4px 8px;
            border-radius: 4px;
            background-color: var(--unavailable-bg);
            text-transform: uppercase;
        }

        .unavailable .wine-details,
        .unavailable .wine-price {
            opacity: 0.5;
        }

        .unavailable .wine-price {
            text-decoration: none;
            color: var(--secondary-color);
        }

        #loading-text {
            text-align: center;
            font-family: var(--font-serif);
            font-size: 1.5em;
            color: var(--primary-color);
            margin-top: 50px;
            display: none;
        }
        
        #loading-text span {
            display: inline-block;
            animation: blink 1s infinite;
        }

        #loading-text span:nth-child(2) {
            animation-delay: 0.2s;
        }

        #loading-text span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .admin-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 1.5em;
            opacity: 0.1;
            transition: opacity 0.3s ease-in-out;
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .admin-link:hover {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2.5em;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--primary-color);
        }

        #modal-wine-name {
            font-family: var(--font-serif);
            color: var(--primary-color);
            font-size: 1.8em;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        .modal-origin {
            font-family: var(--font-serif);
            font-size: 1.2em;
            color: var(--secondary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        #modal-wine-flag {
            font-size: 1.8em;
            margin-right: 12px;
            line-height: 1;
            font-family: 'Noto Color Emoji', sans-serif;
        }
        
        #modal-wine-description {
            font-size: 1.1em;
            line-height: 1.6;
            color: var(--text-color);
            white-space: pre-wrap;
            padding-top: 15px;
        }

    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>CARTA DEI VINI</h1>
        </header>

        <!-- FILTER BAR -->
        <div class="filter-bar" id="filter-bar" style="display:none;">
            <div class="filter-header" id="filter-header">
                <span class="filter-header-label">
                    <span class="bottle-icon" id="bottle-icon">
                        <svg viewBox="0 0 24 80" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9.5 0 h5 c0.8 0 1.5 0.7 1.5 1.5 v16 c0 0 0 1 0.5 2 c2 4 4.5 7 4.5 12 v42 c0 3.5 -2.5 6.5 -6 6.5 h-6 c-3.5 0 -6 -3 -6 -6.5 v-42 c0 -5 2.5 -8 4.5 -12 c0.5 -1 0.5 -2 0.5 -2 v-16 c0 -0.8 0.7 -1.5 1.5 -1.5z"/>
                        </svg>
                    </span>
                    Filtra la carta
                    <span class="active-count" id="active-count" style="display:none"></span>
                </span>
            </div>
            <div class="filter-body" id="filter-body">
                <div class="filter-row">
                    <label class="filter-toggle">
                        <input type="checkbox" id="filter-available" checked>
                        Solo disponibili
                    </label>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Tipo</span>
                    <div class="filter-chips" id="chips-type"></div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Paese</span>
                    <div class="country-chips-desktop" id="chips-country-desktop"></div>
                    <div class="country-dropdown-mobile" id="country-mobile">
                        <select class="country-select" id="country-select">
                            <option value="">Seleziona paese...</option>
                        </select>
                        <div class="country-tags" id="country-tags"></div>
                    </div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Prezzo</span>
                    <div class="filter-chips" id="chips-price"></div>
                </div>
            </div>
        </div>
        
        <main id="wine-list"></main>

        <div id="loading-text">
            Controllo in cantina<span>.</span><span>.</span><span>.</span>
        </div>

        <a href="admin.html" class="admin-link" aria-label="Vai alla pagina di amministrazione">
            <i class="fas fa-cog"></i>
        </a>
    </div>

    <div id="wine-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modal-wine-name">Nome del Vino</h3>
            <div id="modal-wine-origin" class="modal-origin">
                <span id="modal-wine-flag"></span>
                <span id="modal-wine-info"></span>
            </div>
            <p id="modal-wine-description">Descrizione del vino...</p>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbwIhY-mG3pIMos7nFjF-B382QwK8ROqc8TBFC9PJtpVi4IfPw1ug-2ajhKSB_Vl5LNh/exec';
            const wineList = document.getElementById('wine-list');
            const loadingText = document.getElementById('loading-text');

            const modal = document.getElementById('wine-modal');
            const modalClose = document.querySelector('.modal-close');
            const modalWineName = document.getElementById('modal-wine-name');
            const modalWineFlag = document.getElementById('modal-wine-flag');
            const modalWineInfo = document.getElementById('modal-wine-info');
            const modalWineDescription = document.getElementById('modal-wine-description');

            // === FILTER STATE ===
            let allWines = [];
            let filtersOpen = false;
            const activeTypes = new Set();
            const activeCountries = new Set();
            const activePrices = new Set();
            const priceBands = [
                { label: '25-45€', min: 25, max: 45 },
                { label: '45-65€', min: 45, max: 65 },
                { label: 'Oltre 65€', min: 65, max: 99999 }
            ];

            // === FILTER UI ELEMENTS ===
            const filterBar = document.getElementById('filter-bar');
            const filterHeader = document.getElementById('filter-header');
            const filterBody = document.getElementById('filter-body');
            const bottleIcon = document.getElementById('bottle-icon');
            const activeCountEl = document.getElementById('active-count');
            const filterAvailable = document.getElementById('filter-available');
            const countrySelect = document.getElementById('country-select');
            const countryTagsEl = document.getElementById('country-tags');

            filterHeader.addEventListener('click', () => {
                filtersOpen = !filtersOpen;
                filterBody.classList.toggle('open', filtersOpen);
                bottleIcon.classList.toggle('open', filtersOpen);
            });

            filterAvailable.addEventListener('change', applyFilters);

            // === COUNTRY DROPDOWN (MOBILE) ===
            countrySelect.addEventListener('change', () => {
                const val = countrySelect.value;
                if (!val || activeCountries.has(val)) {
                    countrySelect.value = '';
                    return;
                }
                activeCountries.add(val);
                countrySelect.value = '';
                syncCountryChips();
                renderCountryTags();
                applyFilters();
            });

            function renderCountryTags() {
                countryTagsEl.innerHTML = '';
                activeCountries.forEach(country => {
                    const tag = document.createElement('span');
                    tag.className = 'country-tag';
                    tag.textContent = country + ' ';
                    const x = document.createElement('span');
                    x.className = 'country-tag-x';
                    x.textContent = '\u00D7';
                    x.addEventListener('click', () => {
                        activeCountries.delete(country);
                        syncCountryChips();
                        renderCountryTags();
                        applyFilters();
                    });
                    tag.appendChild(x);
                    countryTagsEl.appendChild(tag);
                });
            }

            function syncCountryChips() {
                const desktopChips = document.querySelectorAll('#chips-country-desktop .chip');
                desktopChips.forEach(chip => {
                    chip.classList.toggle('active', activeCountries.has(chip.textContent));
                });
            }

            // === CHIP BUILDERS ===
            function buildChips(containerId, items, activeSet) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                items.forEach(item => {
                    const label = typeof item === 'string' ? item : item.label;
                    const chip = document.createElement('span');
                    chip.className = 'chip';
                    chip.textContent = label;
                    chip.addEventListener('click', () => {
                        if (activeSet.has(label)) {
                            activeSet.delete(label);
                        } else {
                            activeSet.add(label);
                        }
                        chip.classList.toggle('active');
                        applyFilters();
                    });
                    container.appendChild(chip);
                });
            }

            function buildCountryChipsDesktop(countries) {
                const container = document.getElementById('chips-country-desktop');
                container.innerHTML = '';
                countries.forEach(country => {
                    const chip = document.createElement('span');
                    chip.className = 'chip';
                    chip.textContent = country;
                    chip.addEventListener('click', () => {
                        if (activeCountries.has(country)) {
                            activeCountries.delete(country);
                        } else {
                            activeCountries.add(country);
                        }
                        chip.classList.toggle('active');
                        renderCountryTags();
                        applyFilters();
                    });
                    container.appendChild(chip);
                });
            }

            function buildCountryDropdown(countries) {
                countrySelect.innerHTML = '<option value="">Seleziona paese...</option>';
                countries.forEach(country => {
                    const opt = document.createElement('option');
                    opt.value = country;
                    opt.textContent = country;
                    countrySelect.appendChild(opt);
                });
            }

            // === ACTIVE COUNT BADGE ===
            function updateActiveCount() {
                const count = activeTypes.size + activeCountries.size + activePrices.size;
                if (count > 0) {
                    activeCountEl.textContent = count + ' filtri attivi';
                    activeCountEl.style.display = 'inline';
                } else {
                    activeCountEl.style.display = 'none';
                }
            }

            // === APPLY FILTERS ===
            function applyFilters() {
                updateActiveCount();
                const onlyAvailable = filterAvailable.checked;

                const filtered = allWines.filter(wine => {
                    if (onlyAvailable && !wine.Disponibile) return false;
                    if (activeTypes.size && !activeTypes.has(wine.Categoria)) return false;
                    if (activeCountries.size && !activeCountries.has(wine.Nazione)) return false;
                    if (activePrices.size) {
                        const match = priceBands.some(b =>
                            activePrices.has(b.label) &&
                            wine.Prezzo >= b.min &&
                            wine.Prezzo < (b.max === 99999 ? 99999 : b.max + 0.01)
                        );
                        if (!match) return false;
                    }
                    return true;
                });

                if (filtered.length === 0) {
                    wineList.innerHTML = '<div class="no-results">Nessun vino corrisponde ai filtri selezionati</div>';
                } else {
                    groupAndRenderWines(filtered);
                }
            }

            // === INIT FILTERS FROM DATA ===
            function initFilters(wines) {
                const categories = [];
                const categorySeen = new Set();
                wines.forEach(w => {
                    if (!categorySeen.has(w.Categoria)) {
                        categorySeen.add(w.Categoria);
                        categories.push(w.Categoria);
                    }
                });

                const countries = [...new Set(wines.map(w => w.Nazione))].sort();

                buildChips('chips-type', categories, activeTypes);
                buildCountryChipsDesktop(countries);
                buildCountryDropdown(countries);
                buildChips('chips-price', priceBands, activePrices);

                filterBar.style.display = '';
            }

            // === ORIGINAL FUNCTIONS ===
            function showLoading() {
                loadingText.style.display = 'block';
                wineList.style.display = 'none';
            }

            function hideLoading() {
                loadingText.style.display = 'none';
                wineList.style.display = 'block';
            }

            function getFlagEmoji(countryName) {
                const countryMap = {
                    'Francia': '\uD83C\uDDEB\uD83C\uDDF7',
                    'Italia': '\uD83C\uDDEE\uD83C\uDDF9',

                    'Ucraina': '\uD83C\uDDFA\uD83C\uDDE6',
                    'Regno Unito': '\uD83C\uDDEC\uD83C\uDDE7',
                    'Inghilterra': '\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F',
                    'Argentina': '\uD83C\uDDE6\uD83C\uDDF7',
                    'Cile': '\uD83C\uDDE8\uD83C\uDDF1',
                    'Stati Uniti': '\uD83C\uDDFA\uD83C\uDDF8',
                    'USA': '\uD83C\uDDFA\uD83C\uDDF8',
                    'Brasile': '\uD83C\uDDE7\uD83C\uDDF7',
                    'Uruguay': '\uD83C\uDDFA\uD83C\uDDFE',
                    'Messico': '\uD83C\uDDF2\uD83C\uDDFD',
                    'Canada': '\uD83C\uDDE8\uD83C\uDDE6',
                    'Peru': '\uD83C\uDDF5\uD83C\uDDEA',
                    'Australia': '\uD83C\uDDE6\uD83C\uDDFA',
                    'Nuova Zelanda': '\uD83C\uDDF3\uD83C\uDDFF',
                    'Sud Africa': '\uD83C\uDDFF\uD83C\uDDE6',
                    'Sudafrica': '\uD83C\uDDFF\uD83C\uDDE6',
                    'Marocco': '\uD83C\uDDF2\uD83C\uDDE6',
                    'Tunisia': '\uD83C\uDDF9\uD83C\uDDF3',
                    'Algeria': '\uD83C\uDDE9\uD83C\uDDFF',
                    'Giappone': '\uD83C\uDDEF\uD83C\uDDF5',
                    'Cina': '\uD83C\uDDE8\uD83C\uDDF3',
                    'India': '\uD83C\uDDEE\uD83C\uDDF3',
                    'Libano': '\uD83C\uDDF1\uD83C\uDDE7',
                    'Israele': '\uD83C\uDDEE\uD83C\uDDF1',
                    'Turchia': '\uD83C\uDDF9\uD83C\uDDF7',
                    'Cipro': '\uD83C\uDDE8\uD83C\uDDFE'
                };
                
                return countryMap[countryName] || '\uD83C\uDF0D';
            }

            function openModal(wine) {
                modalWineName.textContent = wine.Nome;
                modalWineDescription.textContent = wine.Descrizione;

                modalWineFlag.textContent = getFlagEmoji(wine.Nazione);
                
                let infoText = wine.Nazione;
                if (wine.AOC && wine.AOC.trim() !== '') {
                    infoText += ` - ${wine.AOC}`;
                }
                modalWineInfo.textContent = infoText;

                modal.style.display = 'flex';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            function groupAndRenderWines(wines) {
                wineList.innerHTML = '';
                
                const groupedWines = wines.reduce((acc, wine) => {
                    const category = wine.Categoria;
                    const country = wine.Nazione;

                    if (!acc[category]) {
                        acc[category] = {};
                    }
                    if (!acc[category][country]) {
                        acc[category][country] = [];
                    }
                    acc[category][country].push(wine);
                    return acc;
                }, {});

                for (const category in groupedWines) {
                    const section = document.createElement('section');
                    section.className = 'wine-section';

                    const title = document.createElement('h2');
                    title.className = 'wine-section-title';
                    title.textContent = category;
                    section.appendChild(title);

                    for (const country in groupedWines[category]) {
                        const countryTitle = document.createElement('h3');
                        countryTitle.className = 'country-title';
                        countryTitle.textContent = country;
                        section.appendChild(countryTitle);

                        groupedWines[category][country].forEach(wine => {
                            const isAvailable = wine.Disponibile;
                            
                            const item = document.createElement('div');
                            item.className = 'wine-item';
                            if (!isAvailable) {
                                item.classList.add('unavailable');
                            }

                            if (wine.Descrizione && wine.Descrizione.toString().trim() !== '') {
                                item.style.cursor = 'pointer';
                                item.setAttribute('data-has-description', 'true'); 
                                
                                item.addEventListener('click', () => {
                                    openModal(wine);
                                });
                            }

                            const details = document.createElement('div');
                            details.className = 'wine-details';

                            const name = document.createElement('div');
                            name.className = 'wine-name';
                            name.textContent = wine.Nome;
                            details.appendChild(name);

                            const info = document.createElement('div');
                            info.className = 'wine-info';
                            
                            const parts = [];
                            if (wine.Anno) {
                                parts.push(wine.Anno);
                            }
                            if (wine.AOC) {
                                parts.push(wine.AOC);
                            }
                            
                            let infoContent = parts.join(' - ');
                            
                            if (wine.Vitigni) {
                                if (infoContent.length > 0) {
                                    infoContent += ' ';
                                }
                                infoContent += `(${wine.Vitigni})`;
                            }

                            info.textContent = infoContent.trim();
                            details.appendChild(info);

                            item.appendChild(details);

                            if (isAvailable) {
                                const price = document.createElement('div');
                                price.className = 'wine-price';
                                price.textContent = `€ ${wine.Prezzo}`;
                                item.appendChild(price);
                            } else {
                                const unavailableTag = document.createElement('span');
                                unavailableTag.className = 'unavailability-tag';
                                unavailableTag.textContent = 'terminato';
                                item.appendChild(unavailableTag);
                            }
                            
                            section.appendChild(item);
                        });
                    }
                    wineList.appendChild(section);
                }
            }

            function fetchWines() {
                showLoading();
                fetch(appsScriptUrl + '?t=' + Date.now())
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Errore di rete. Status: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(wines => {
                        allWines = wines;
                        initFilters(wines);
                        applyFilters();
                    })
                    .catch(error => {
                        console.error('Errore nel caricamento dei vini:', error);
                        wineList.innerHTML = '<p style="text-align: center; color: var(--unavailable-color);">Errore nel caricamento della carta dei vini. Riprova più tardi.</p>';
                    })
                    .finally(() => {
                        hideLoading();
                    });
            }
            
            fetchWines();
        });
    </script>
</body>
</html>
